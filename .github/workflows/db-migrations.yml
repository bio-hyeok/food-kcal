name: db-migrations

on:
  pull_request:
    paths: ['server/db/**', '.github/workflows/db-migrations.yml']
  push:
    branches: [main, develop, 'feature/**']
    paths: ['server/db/**', '.github/workflows/db-migrations.yml']

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash server/db/test-migrations.sh
